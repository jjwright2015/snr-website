<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

--><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drivers — Saturday Night Racing League</title>
<meta name="description" content="Career stats, best seasons, best tracks and records for every Saturday Night Racing League driver.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Saturday Night Racing League">
  <meta property="og:title" content="Drivers — Saturday Night Racing League">
  <meta property="og:description" content="Career stats, best seasons, best tracks and records for every Saturday Night Racing League driver.">
  <meta property="og:image" content="https://snrleague.com/assets/snr-logo-new.png">
  <meta property="og:url" content="https://snrleague.com/drivers.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Drivers — Saturday Night Racing League">
  <meta name="twitter:description" content="Career stats, best seasons, best tracks and records for every Saturday Night Racing League driver.">
  <meta name="twitter:image" content="https://snrleague.com/assets/snr-logo-new.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.dp { padding-top: var(--nav-height); min-height: 100vh; }
.dp-hero { background: linear-gradient(180deg,var(--surface),var(--bg)); border-bottom:1px solid var(--border); padding:48px 24px 32px; text-align:center; }
.dp-hero h1 { font-family:var(--font-display); font-size:clamp(2rem,5vw,3.5rem); font-weight:800; text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; }
.dp-hero h1 span { color:var(--accent); }
.dp-hero p { color:var(--text-muted); font-size:14px; }
.dp-wrap { max-width:var(--container-max); margin:0 auto; padding:0 16px; }
.dp-h2 { font-family:var(--font-display); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin:28px 0 12px; }
.dp-champs { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.dp-champ { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; cursor:pointer; text-align:left; color:var(--text); font:inherit; transition:border-color var(--transition); }
.dp-champ:hover { border-color:var(--accent); }
.dp-champ small { display:block; font-family:var(--font-display); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); }
.dp-champ b { font-family:var(--font-display); font-size:18px; font-weight:700; }
.dp-champ i { font-style:normal; font-size:12px; color:var(--text-muted); display:block; }
.dp-recs { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
.dp-rec { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; cursor:pointer; text-align:left; color:var(--text); font:inherit; }
.dp-rec:hover { border-color:var(--accent); }
.dp-rec small { display:block; font-size:11px; color:var(--text-muted); }
.dp-rec strong { font-family:var(--font-display); font-size:26px; color:var(--accent); line-height:1.1; }
.dp-rec span { display:block; font-size:13px; }
.dp-controls { display:flex; flex-wrap:wrap; gap:10px; margin:28px 0 8px; align-items:center; }
.dp-controls input, .dp-controls select { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius); padding:10px 12px; font:inherit; font-size:14px; }
.dp-controls input { flex:1; min-width:200px; }
.dp-count { font-size:12px; color:var(--text-muted); margin-bottom:12px; }
.dp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; padding-bottom:56px; }
.dp-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; cursor:pointer; text-align:left; color:var(--text); font:inherit; transition:transform var(--transition),border-color var(--transition); }
.dp-card:hover,.dp-card:focus-visible { transform:translateY(-2px); border-color:var(--accent); outline:none; }
.dp-card h3 { font-family:var(--font-display); font-size:21px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; line-height:1.15; }
.dp-card .sub { font-size:12px; color:var(--text-muted); margin:2px 0 12px; min-height:16px; }
.dp-trophy { color:var(--accent-gold); }
.dp-mini { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.dp-mini div { padding:8px 4px; text-align:center; border-right:1px solid var(--border); }
.dp-mini div:last-child { border-right:0; }
.dp-mini small { display:block; font-family:var(--font-display); font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); }
.dp-mini b { font-family:var(--font-display); font-size:19px; }
.dp-none { grid-column:1/-1; text-align:center; color:var(--text-muted); padding:40px 0; }
.dp-modal { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; z-index:2000; overflow-y:auto; padding:24px 12px; }
.dp-modal.open { display:block; }
.dp-panel { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-lg); max-width:860px; margin:0 auto; position:relative; }
.dp-x { position:absolute; top:10px; right:10px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:18px; line-height:1; }
.dp-head { padding:28px 28px 20px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,var(--surface),var(--bg)); border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
.dp-head h2 { font-family:var(--font-display); font-size:clamp(1.8rem,5vw,2.6rem); font-weight:800; text-transform:uppercase; letter-spacing:1px; line-height:1.05; padding-right:36px; }
.dp-badges { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 0; }
.dp-badge { font-family:var(--font-display); font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; border:1px solid var(--suspended-border); background:var(--suspended-bg); color:var(--accent-gold); border-radius:20px; padding:4px 12px; }
.dp-body { padding:8px 28px 28px; }
.dp-sec { margin-top:22px; }
.dp-sec h4 { font-family:var(--font-display); font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.dp-stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
.dp-stat { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:10px; }
.dp-stat small { display:block; font-family:var(--font-display); font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); }
.dp-stat b { font-family:var(--font-display); font-size:24px; }
.dp-best { background:var(--suspended-bg); border:1px solid var(--suspended-border); border-radius:var(--radius); padding:14px 16px; }
.dp-best b { font-family:var(--font-display); font-size:20px; }
.dp-best p { color:var(--text-muted); font-size:13px; margin-top:4px; }
.dp-two { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.dp-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 12px; margin-bottom:6px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:6px; font-size:13px; }
.dp-row em { font-style:normal; color:var(--text-muted); font-size:12px; }
.dp-row.bad { border-left-color:#c0392b; }
.dp-bar { height:6px; background:var(--surface-3); border-radius:3px; overflow:hidden; margin-top:4px; }
.dp-bar i { display:block; height:100%; background:var(--accent); }
.dp-tbl-wrap { overflow-x:auto; }
.dp-tbl { width:100%; border-collapse:collapse; font-size:13px; }
.dp-tbl th { font-family:var(--font-display); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); text-align:right; padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
.dp-tbl td { text-align:right; padding:7px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
.dp-tbl th:first-child,.dp-tbl td:first-child { text-align:left; }
.dp-tbl tr.champ td { color:var(--accent-gold); font-weight:600; }
.dp-form { display:flex; gap:6px; flex-wrap:wrap; }
.dp-form span { font-family:var(--font-display); font-weight:700; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:4px 10px; }
.dp-form span.w { color:#111; background:var(--accent-gold); border-color:var(--accent-gold); }
.dp-form span.t5 { color:var(--accent-green); }
.dp-srh { display:inline-block; margin-top:22px; color:var(--accent); font-size:13px; text-decoration:none; border:1px solid var(--border); border-radius:var(--radius); padding:9px 14px; }
.dp-note { font-size:12px; color:var(--text-muted); margin-top:10px; }
@media (max-width:640px){ .dp-two{grid-template-columns:1fr} .dp-head,.dp-body{padding-left:16px;padding-right:16px} }
</style>
</head>
<body>
<div id="site-nav"></div>
<script src="site-chrome.js"></script>

<main class="dp">
  <section class="dp-hero">
    <h1>Driver <span>Profiles</span></h1>
    <p id="dpSub">Career stats, best seasons and best tracks.</p>
  </section>
  <div class="dp-wrap">
    <h2 class="dp-h2">Series Champions</h2>
    <div class="dp-champs" id="dpChamps"></div>
    <div class="dp-controls">
      <input type="search" id="dpSearch" placeholder="Search drivers..." aria-label="Search drivers">
      <select id="dpFilter" aria-label="Filter">
        <option value="active">Active in Season 6</option>
        <option value="all">All drivers</option>
        <option value="champs">Champions</option>
        <option value="winners">Race winners</option>
      </select>
      <select id="dpSort" aria-label="Sort">
        <option value="starts">Career starts</option>
        <option value="wins">Career wins</option>
        <option value="top5">Top 5s</option>
        <option value="poles">Poles</option>
        <option value="lapsLed">Laps led</option>
        <option value="avgFinish">Avg finish (10+ starts)</option>
        <option value="name">Name</option>
      </select>
    </div>
    <div class="dp-count" id="dpCount"></div>
    <div class="dp-grid" id="dpGrid"></div>
  </div>
</main>

<div class="dp-modal" id="dpModal" role="dialog" aria-modal="true" aria-label="Driver profile">
  <div class="dp-panel"><button class="dp-x" id="dpX" aria-label="Close">&times;</button><div id="dpBody"></div></div>
</div>

<div id="site-footer"></div>
<script src="site-chrome.js"></script>
<script>
(function () {
  var D, R = null, BY = {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var f1 = function (n) { return Number(n).toFixed(1); };
  var num = function (n) { return Number(n).toLocaleString(); };
  var ord = function (n) { var v = n % 100, s = ['th','st','nd','rd']; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  var TYPE = { 'Superspeedway':'Superspeedways', 'Intermediate':'Intermediates', 'Short track':'Short tracks', 'Road course':'Road courses' };

  // chrome handlers (nav + theme) — site-chrome.js only writes the markup
  var root = document.documentElement;
  try { root.setAttribute('data-theme', 'dark'); } catch (e) {}
  var tt = $('themeToggle');
  if (tt) tt.addEventListener('click', function () {
    var n = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', n);
  });
  var hb = $('hamburger'), nl = $('navLinks');
  if (hb && nl) hb.addEventListener('click', function () { hb.classList.toggle('open'); nl.classList.toggle('open'); });

  function titlesText(d) { return d.titles.length ? d.titles.map(function (s) { return 'S' + s; }).join(' · ') : ''; }

  function card(d) {
    var c = d.career, b = document.createElement('button');
    b.className = 'dp-card'; b.type = 'button';
    var first = d.first.match(/^S(\d+)/)[1], last = d.last.match(/^S(\d+)/)[1];
    b.innerHTML = '<h3>' + esc(d.name) + (d.titles.length ? ' <span class="dp-trophy" title="Series champion">&#127942;&times;' + d.titles.length + '</span>' : '') + '</h3>' +
      '<div class="sub">' + (first === last ? 'Season ' + first : 'Seasons ' + first + '–' + last) + ' &middot; ' + c.starts + ' start' + (c.starts === 1 ? '' : 's') + '</div>' +
      '<div class="dp-mini"><div><small>Wins</small><b>' + c.wins + '</b></div><div><small>Top 5</small><b>' + c.top5 + '</b></div><div><small>Top 10</small><b>' + c.top10 + '</b></div><div><small>Avg Fin</small><b>' + f1(c.avgFinish) + '</b></div></div>';
    b.addEventListener('click', function () { openDriver(d.id, true); });
    return b;
  }

  function list() {
    var q = $('dpSearch').value.trim().toLowerCase(), fl = $('dpFilter').value, so = $('dpSort').value;
    var out = D.drivers.filter(function (d) {
      if (q && d.name.toLowerCase().indexOf(q) < 0) return false;
      if (fl === 'active') return d.active;
      if (fl === 'champs') return d.titles.length > 0;
      if (fl === 'winners') return d.career.wins > 0;
      return true;
    });
    if (so === 'avgFinish') out = out.filter(function (d) { return d.career.starts >= 10; });
    out.sort(function (a, b) {
      if (so === 'name') return a.name.localeCompare(b.name);
      if (so === 'avgFinish') return a.career.avgFinish - b.career.avgFinish;
      return b.career[so] - a.career[so] || b.career.starts - a.career.starts;
    });
    return out;
  }
  function render() {
    var g = $('dpGrid'), l = list(); g.innerHTML = '';
    $('dpCount').textContent = l.length + ' driver' + (l.length === 1 ? '' : 's');
    if (!l.length) { g.innerHTML = '<div class="dp-none">No drivers found</div>'; return; }
    l.forEach(function (d) { g.appendChild(card(d)); });
  }

  function row(left, right, bad) { return '<div class="dp-row' + (bad ? ' bad' : '') + '"><span>' + left + '</span><em>' + right + '</em></div>'; }
  function stat(l, v) { return '<div class="dp-stat"><small>' + l + '</small><b>' + v + '</b></div>'; }

  function profile(d) {
    var c = d.career, badges = '';
    d.titles.forEach(function (s) { badges += '<span class="dp-badge">&#127942; Season ' + s + ' Champion</span>'; });
    var held = (R && R.holders[d.id]) || [];
    if (held.length) badges += '<span class="dp-badge">' + held.length + ' League Record' + (held.length > 1 ? 's' : '') + '</span>';
    var h = '<div class="dp-head"><h2>' + esc(d.name) + '</h2><div class="dp-badges">' + (badges || '<span class="dp-badge" style="color:var(--text-muted);border-color:var(--border);background:none">Seasons ' + Object.keys(d.seasons).join(', ') + '</span>') + '</div></div><div class="dp-body">';

    h += '<div class="dp-sec"><h4>Career</h4><div class="dp-stats">' +
      stat('Starts', c.starts) + stat('Wins', c.wins) + stat('Top 5', c.top5) + stat('Top 10', c.top10) + stat('Poles', c.poles) +
      stat('Laps Led', num(c.lapsLed)) + stat('Fastest Laps', c.fastest) + stat('Avg Finish', f1(c.avgFinish)) + stat('Avg Start', f1(c.avgStart)) +
      stat('Best Finish', ord(c.best)) + stat('DNFs', c.dnf) + stat('Inc / Race', f1(c.avgInc)) + '</div></div>';

    if (held.length) {
      h += '<div class="dp-sec"><h4>League Records Held</h4>' + held.map(function (t) { return row('<strong>' + esc(t) + '</strong>', ''); }).join('') + '<p class="dp-note"><a href="records.html" style="color:var(--accent)">See all league records &rarr;</a></p></div>';
    }

    var bs = d.bestSeason && d.seasons[d.bestSeason];
    if (bs) {
      h += '<div class="dp-sec"><h4>Best Season</h4><div class="dp-best"><b>Season ' + d.bestSeason + ' &mdash; ' + ord(bs.pos) + ' in the standings' + (bs.champion ? ' (Champion)' : '') + '</b><p>' +
        bs.points + ' pts &middot; ' + bs.wins + ' win' + (bs.wins === 1 ? '' : 's') + ' &middot; ' + bs.top5 + ' top 5s &middot; ' + bs.top10 + ' top 10s &middot; ' + bs.starts + ' starts &middot; avg finish ' + f1(bs.avgFinish) + '</p></div></div>';
    }

    var trk = d.bestTracks.map(function (t) {
      var a = d.tracks[t];
      return row('<strong>' + esc(t) + '</strong>', 'avg ' + f1(a.avgFinish) + ' &middot; ' + a.starts + ' starts' + (a.wins ? ' &middot; ' + a.wins + ' win' + (a.wins > 1 ? 's' : '') : ''));
    }).join('');
    var worst = Object.keys(d.tracks).filter(function (t) { return d.tracks[t].starts >= 3; })
      .sort(function (a, b) { return d.tracks[b].avgFinish - d.tracks[a].avgFinish; }).slice(0, 3)
      .filter(function (t) { return d.bestTracks.indexOf(t) < 0; })
      .map(function (t) { var a = d.tracks[t]; return row('<strong>' + esc(t) + '</strong>', 'avg ' + f1(a.avgFinish) + ' &middot; ' + a.starts + ' starts', true); }).join('');
    h += '<div class="dp-sec"><div class="dp-two"><div><h4>Best Tracks</h4>' + (trk || '<p class="dp-note">Needs 3+ starts at a track.</p>') + '</div><div><h4>Toughest Tracks</h4>' + (worst || '<p class="dp-note">Not enough track history yet.</p>') + '</div></div><p class="dp-note">Ranked by average finish, minimum 3 starts at the track.</p></div>';

    var types = Object.keys(d.types).map(function (t) {
      var a = d.types[t], pct = Math.max(4, 100 - (a.avgFinish - 1) / 25 * 100);
      return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>' + (TYPE[t] || esc(t)) + ' <em style="color:var(--text-muted);font-style:normal">(' + a.starts + ')</em></span><span>avg ' + f1(a.avgFinish) + (a.wins ? ' &middot; ' + a.wins + ' W' : '') + '</span></div><div class="dp-bar"><i style="width:' + pct + '%"></i></div></div>';
    }).join('');
    h += '<div class="dp-sec"><h4>By Track Type</h4>' + types + '</div>';

    var rows = Object.keys(d.seasons).map(function (s) {
      var a = d.seasons[s];
      return '<tr class="' + (a.champion ? 'champ' : '') + '"><td>S' + s + (a.champion ? ' &#127942;' : '') + '</td><td>' + (a.pos ? ord(a.pos) : '–') + '</td><td>' + (a.points || '–') + '</td><td>' + a.starts + '</td><td>' + a.wins + '</td><td>' + a.top5 + '</td><td>' + a.top10 + '</td><td>' + a.poles + '</td><td>' + num(a.lapsLed) + '</td><td>' + f1(a.avgFinish) + '</td></tr>';
    }).join('');
    h += '<div class="dp-sec"><h4>Season by Season</h4><div class="dp-tbl-wrap"><table class="dp-tbl"><thead><tr><th>Season</th><th>Pos</th><th>Pts</th><th>Starts</th><th>Wins</th><th>T5</th><th>T10</th><th>Poles</th><th>Led</th><th>Avg Fin</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';

    h += '<div class="dp-sec"><h4>Last ' + d.recent.length + ' Finishes</h4><div class="dp-form">' + d.recent.map(function (p) { return '<span class="' + (p === 1 ? 'w' : p <= 5 ? 't5' : '') + '">P' + p + '</span>'; }).join('') + '</div></div>';

    if (d.srh) h += '<a class="dp-srh" target="_blank" rel="noopener noreferrer" href="https://www.simracerhub.com/scoring/driver_stats.php?driver_id=' + d.srh + '&series_id=9950">View on SimRacerHub &rarr;</a>';
    return h + '</div>';
  }

  function openDriver(id, push) {
    var d = BY[id]; if (!d) return;
    $('dpBody').innerHTML = profile(d);
    $('dpModal').classList.add('open'); document.body.style.overflow = 'hidden'; $('dpModal').scrollTop = 0;
    if (push) { try { history.replaceState(null, '', '#driver=' + d.id); } catch (e) {} }
  }
  function closeDriver() {
    $('dpModal').classList.remove('open'); document.body.style.overflow = '';
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  $('dpX').addEventListener('click', closeDriver);
  $('dpModal').addEventListener('click', function (e) { if (e.target === $('dpModal')) closeDriver(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDriver(); });

  fetch('records_data.json').then(function (r) { return r.json(); }).then(function (x) { R = x; }).catch(function () {})
  .then(function () { return fetch('driver_data.json'); }).then(function (r) { return r.json(); }).then(function (data) {
    D = data; D.drivers.forEach(function (d) { BY[d.id] = d; });
    var byName = {}; D.drivers.forEach(function (d) { byName[d.name] = d; });
    $('dpSub').textContent = D.drivers.length + ' drivers · Seasons 1–' + D.seasonsCount + ' · Career stats, best seasons and best tracks';
    $('dpChamps').innerHTML = Object.keys(D.champions).map(function (s) {
      var n = D.champions[s], d = byName[n], a = d && d.seasons[s];
      return '<button class="dp-champ" data-id="' + (d ? d.id : '') + '"><small>Season ' + s + '</small><b>&#127942; ' + esc(n) + '</b><i>' + (a ? a.points + ' pts · ' + a.wins + ' win' + (a.wins === 1 ? '' : 's') : '') + '</i></button>';
    }).join('');
    document.querySelectorAll('.dp-champ').forEach(function (b) { b.addEventListener('click', function () { openDriver(+b.dataset.id, true); }); });
    ['dpSearch'].forEach(function (i) { $(i).addEventListener('input', render); });
    ['dpFilter','dpSort'].forEach(function (i) { $(i).addEventListener('change', render); });
    render();
    var m = location.hash.match(/driver=(\d+)/); if (m) openDriver(+m[1], false);
  }).catch(function () { $('dpGrid').innerHTML = '<div class="dp-none">Driver data could not be loaded. Please refresh.</div>'; });
})();
</script>
</body>
</html>
