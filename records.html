<html lang="en" data-theme="dark">
<head>

--><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Records — Saturday Night Racing League</title>
<meta name="description" content="League records, streaks and top performances in Saturday Night Racing League history.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Saturday Night Racing League">
  <meta property="og:title" content="League Records — Saturday Night Racing League">
  <meta property="og:description" content="League records, streaks and top performances in Saturday Night Racing League history.">
  <meta property="og:image" content="https://snrleague.com/assets/snr-logo-new.png">
  <meta property="og:url" content="https://snrleague.com/records.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="League Records — Saturday Night Racing League">
  <meta name="twitter:description" content="League records, streaks and top performances in Saturday Night Racing League history.">
  <meta name="twitter:image" content="https://snrleague.com/assets/snr-logo-new.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.dp { padding-top: var(--nav-height); min-height: 100vh; }
.dp-hero { background: linear-gradient(180deg,var(--surface),var(--bg)); border-bottom:1px solid var(--border); padding:48px 24px 32px; text-align:center; }
.dp-hero h1 { font-family:var(--font-display); font-size:clamp(2rem,5vw,3.5rem); font-weight:800; text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; }
.dp-hero h1 span { color:var(--accent); }
.dp-hero p { color:var(--text-muted); font-size:14px; }
.dp-wrap { max-width:var(--container-max); margin:0 auto; padding:0 16px; }
.dp-h2 { font-family:var(--font-display); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin:28px 0 12px; }
.dp-champs { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.dp-champ { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; cursor:pointer; text-align:left; color:var(--text); font:inherit; transition:border-color var(--transition); }
.dp-champ:hover { border-color:var(--accent); }
.dp-champ small { display:block; font-family:var(--font-display); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); }
.dp-champ b { font-family:var(--font-display); font-size:18px; font-weight:700; }
.dp-champ i { font-style:normal; font-size:12px; color:var(--text-muted); display:block; }
.dp-recs { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
.dp-rec { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; cursor:pointer; text-align:left; color:var(--text); font:inherit; }
.dp-rec:hover { border-color:var(--accent); }
.dp-rec small { display:block; font-size:11px; color:var(--text-muted); }
.dp-rec strong { font-family:var(--font-display); font-size:26px; color:var(--accent); line-height:1.1; }
.dp-rec span { display:block; font-size:13px; }
.dp-controls { display:flex; flex-wrap:wrap; gap:10px; margin:28px 0 8px; align-items:center; }
.dp-controls input, .dp-controls select { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius); padding:10px 12px; font:inherit; font-size:14px; }
.dp-controls input { flex:1; min-width:200px; }
.dp-count { font-size:12px; color:var(--text-muted); margin-bottom:12px; }
.dp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; padding-bottom:56px; }
.dp-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; cursor:pointer; text-align:left; color:var(--text); font:inherit; transition:transform var(--transition),border-color var(--transition); }
.dp-card:hover,.dp-card:focus-visible { transform:translateY(-2px); border-color:var(--accent); outline:none; }
.dp-card h3 { font-family:var(--font-display); font-size:21px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; line-height:1.15; }
.dp-card .sub { font-size:12px; color:var(--text-muted); margin:2px 0 12px; min-height:16px; }
.dp-trophy { color:var(--accent-gold); }
.dp-mini { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.dp-mini div { padding:8px 4px; text-align:center; border-right:1px solid var(--border); }
.dp-mini div:last-child { border-right:0; }
.dp-mini small { display:block; font-family:var(--font-display); font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); }
.dp-mini b { font-family:var(--font-display); font-size:19px; }
.dp-none { grid-column:1/-1; text-align:center; color:var(--text-muted); padding:40px 0; }
.dp-modal { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; z-index:2000; overflow-y:auto; padding:24px 12px; }
.dp-modal.open { display:block; }
.dp-panel { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-lg); max-width:860px; margin:0 auto; position:relative; }
.dp-x { position:absolute; top:10px; right:10px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:18px; line-height:1; }
.dp-head { padding:28px 28px 20px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,var(--surface),var(--bg)); border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
.dp-head h2 { font-family:var(--font-display); font-size:clamp(1.8rem,5vw,2.6rem); font-weight:800; text-transform:uppercase; letter-spacing:1px; line-height:1.05; padding-right:36px; }
.dp-badges { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 0; }
.dp-badge { font-family:var(--font-display); font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; border:1px solid var(--suspended-border); background:var(--suspended-bg); color:var(--accent-gold); border-radius:20px; padding:4px 12px; }
.dp-body { padding:8px 28px 28px; }
.dp-sec { margin-top:22px; }
.dp-sec h4 { font-family:var(--font-display); font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.dp-stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
.dp-stat { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:10px; }
.dp-stat small { display:block; font-family:var(--font-display); font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); }
.dp-stat b { font-family:var(--font-display); font-size:24px; }
.dp-best { background:var(--suspended-bg); border:1px solid var(--suspended-border); border-radius:var(--radius); padding:14px 16px; }
.dp-best b { font-family:var(--font-display); font-size:20px; }
.dp-best p { color:var(--text-muted); font-size:13px; margin-top:4px; }
.dp-two { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.dp-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 12px; margin-bottom:6px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:6px; font-size:13px; }
.dp-row em { font-style:normal; color:var(--text-muted); font-size:12px; }
.dp-row.bad { border-left-color:#c0392b; }
.dp-bar { height:6px; background:var(--surface-3); border-radius:3px; overflow:hidden; margin-top:4px; }
.dp-bar i { display:block; height:100%; background:var(--accent); }
.dp-tbl-wrap { overflow-x:auto; }
.dp-tbl { width:100%; border-collapse:collapse; font-size:13px; }
.dp-tbl th { font-family:var(--font-display); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); text-align:right; padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
.dp-tbl td { text-align:right; padding:7px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
.dp-tbl th:first-child,.dp-tbl td:first-child { text-align:left; }
.dp-tbl tr.champ td { color:var(--accent-gold); font-weight:600; }
.dp-form { display:flex; gap:6px; flex-wrap:wrap; }
.dp-form span { font-family:var(--font-display); font-weight:700; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:4px 10px; }
.dp-form span.w { color:#111; background:var(--accent-gold); border-color:var(--accent-gold); }
.dp-form span.t5 { color:var(--accent-green); }
.dp-srh { display:inline-block; margin-top:22px; color:var(--accent); font-size:13px; text-decoration:none; border:1px solid var(--border); border-radius:var(--radius); padding:9px 14px; }
.dp-note { font-size:12px; color:var(--text-muted); margin-top:10px; }
@media (max-width:640px){ .dp-two{grid-template-columns:1fr} .dp-head,.dp-body{padding-left:16px;padding-right:16px} }
</style><style>
.rc-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 8px}
.rc-tab{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);border-radius:20px;padding:8px 18px;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.rc-tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#111}
.rc-asof{font-size:12px;color:var(--text-muted);margin:6px 0 16px}
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding-bottom:56px;align-items:start}
.rc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.rc-card h3{font-family:var(--font-display);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);line-height:1.2}
.rc-note{font-size:11px;color:var(--text-muted);margin-top:4px}
.rc-list{list-style:none;margin:12px 0 0;padding:0}
.rc-item{border-top:1px solid var(--border)}
.rc-item:first-child{border-top:0}
.rc-line{display:flex;align-items:center;gap:10px;padding:9px 0;width:100%;background:none;border:0;color:var(--text);font:inherit;text-align:left}
button.rc-line{cursor:pointer}
.rc-rank{font-family:var(--font-display);font-weight:800;font-size:18px;width:24px;color:var(--text-muted);flex:none}
.rc-item.r1 .rc-rank{color:var(--accent-gold)} .rc-item.r2 .rc-rank{color:var(--silver)} .rc-item.r3 .rc-rank{color:var(--bronze)}
.rc-who{flex:1;min-width:0}
.rc-who b{display:block;font-size:14px;font-weight:600}
.rc-who a{color:inherit;text-decoration:none} .rc-who a:hover{color:var(--accent);text-decoration:underline}
.rc-who small{display:block;font-size:11px;color:var(--text-muted);line-height:1.35}
.rc-val{font-family:var(--font-display);font-size:22px;font-weight:700;flex:none}
.rc-val small{font-size:11px;color:var(--text-muted);font-weight:400;margin-left:3px}
.rc-chev{color:var(--text-muted);font-size:12px;transition:transform .2s}
.rc-line[aria-expanded="true"] .rc-chev{transform:rotate(180deg)}
.rc-dfs{padding:0 0 12px 34px}
.rc-dfs table{width:100%;border-collapse:collapse;font-size:12px}
.rc-dfs td{padding:4px 0;border-bottom:1px solid var(--border)} .rc-dfs td:last-child{text-align:right;font-weight:600}
.rc-dfs tr.tot td{border-bottom:0;color:var(--accent-gold);font-weight:700}
.rc-dfs p{font-size:12px;color:var(--text-muted);margin:0 0 8px}
.rc-neg{color:#e05a4a}
.rc-trk{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rc-trk .rc-card h3{font-size:16px;color:var(--text)}
.rc-more{font-size:11px;color:var(--text-muted);padding-top:6px}
</style>
</head>
<body>
<div id="site-nav"></div>
<script src="site-chrome.js"></script>
<main class="dp">
  <section class="dp-hero"><h1>League <span>Records</span></h1><p id="rcSub">Streaks, single-race marks, career and season bests.</p></section>
  <div class="dp-wrap">
    <div class="rc-tabs" id="rcTabs" role="tablist"></div>
    <div class="rc-asof" id="rcAsof"></div>
    <div id="rcBody"></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="site-chrome.js"></script>
<script>
(function(){
  var D,tab='Streaks',$=function(i){return document.getElementById(i)};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var root=document.documentElement;
  try{root.setAttribute('data-theme','dark')}catch(e){}
  var tt=$('themeToggle');if(tt)tt.addEventListener('click',function(){var n=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{}catch(e){}});
  var hb=$('hamburger'),nl=$('navLinks');if(hb&&nl)hb.addEventListener('click',function(){hb.classList.toggle('open');nl.classList.toggle('open')});
  var TABS=['Streaks','Single Race','Career','Season','Tracks'];
  function val(c,v){
    if(c.fmt==='dec')return v.toFixed(2);
    if(c.fmt==='pct')return v.toFixed(1)+'%';
    if(c.fmt==='pos')return 'P'+v;
    if(c.fmt==='dfs')return String(Math.round(v*100)/100);
    return Number(v).toLocaleString();
  }
  function who(e){
    var n=e.name||D.names[e.id];
    return e.id?'<a href="drivers.html#driver='+e.id+'">'+esc(n)+'</a>':esc(n);
  }
  function dfsRows(e){
    var x=e.dfs,t=0,rows=x.parts.map(function(p){var v=Math.round(p[1]*100)/100;if(v===0)v=0;t+=p[1];return'<tr><td>'+p[0]+'</td><td class="'+(v<0?'rc-neg':'')+'">'+(v>0?'+':'')+v+'</td></tr>'}).join('');
    return'<div class="rc-dfs"><p>Started P'+x.start+', finished P'+x.finish+' &middot; '+x.lapsLed+' laps led &middot; '+x.incidents+' incident'+(x.incidents===1?'':'s')+(x.fastest?' &middot; fastest lap':'')+'</p><table>'+rows+'<tr class="tot"><td>Total</td><td>'+Math.round(e.value*100)/100+'</td></tr></table></div>';
  }
  function card(c){
    var h='<div class="rc-card"><h3>'+esc(c.title)+'</h3>'+(c.note?'<div class="rc-note">'+esc(c.note)+'</div>':'')+'<ul class="rc-list">';
    c.entries.forEach(function(e,i){
      var inner='<span class="rc-rank">'+e.rank+'</span><span class="rc-who"><b>'+who(e)+'</b>'+(e.detail?'<small>'+esc(e.detail)+'</small>':'')+'</span><span class="rc-val">'+val(c,e.value)+(c.unit&&c.fmt!=='pct'&&c.fmt!=='pos'&&c.fmt!=='dfs'&&c.fmt!=='dec'?'<small>'+esc(c.unit)+'</small>':'')+(c.fmt==='dfs'?'<small>pts</small>':'')+'</span>';
      if(e.dfs){
        var id='dfs'+c.key+i;
        h+='<li class="rc-item r'+Math.min(e.rank,3)+'"><button type="button" class="rc-line" aria-expanded="false" aria-controls="'+id+'" data-dfs="'+id+'">'+inner+'<span class="rc-chev">&#9660;</span></button><div id="'+id+'" hidden>'+dfsRows(e)+'</div></li>';
      }else h+='<li class="rc-item r'+Math.min(e.rank,3)+'"><div class="rc-line">'+inner+'</div></li>';
    });
    return h+'</ul></div>';
  }
  function trackCard(t){
    var shown=t.entries.length,more=t.winners-shown;
    return'<div class="rc-card"><h3>'+esc(t.track)+'</h3><div class="rc-note">'+t.races+' race'+(t.races===1?'':'s')+' &middot; '+esc(t.type)+' &middot; '+t.winners+' different winner'+(t.winners===1?'':'s')+'</div><ul class="rc-list">'+t.entries.map(function(e){return'<li class="rc-item r'+Math.min(e.rank,3)+'"><div class="rc-line"><span class="rc-rank">'+e.rank+'</span><span class="rc-who"><b>'+who(e)+'</b><small>'+esc(e.detail)+'</small></span><span class="rc-val">'+e.value+'<small>win'+(e.value===1?'':'s')+'</small></span></div></li>'}).join('')+'</ul>'+(more>0?'<div class="rc-more">+ '+more+' more winner'+(more===1?'':'s')+'</div>':'')+'</div>';
  }
  function render(){
    var h='<div class="rc-grid">';
    D.categories.filter(function(c){return c.tab===tab}).forEach(function(c){h+=card(c)});
    if(tab==='Career'){
      h+='<div class="rc-card"><h3>Won in Their Series Debut</h3><ul class="rc-list">'+D.debutWinners.map(function(e){return'<li class="rc-item"><div class="rc-line"><span class="rc-who"><b>'+who(e)+'</b><small>'+esc(e.detail)+'</small></span></div></li>'}).join('')+'</ul></div>';
    }
    h+='</div>';
    if(tab==='Tracks'){
      h+='<h2 class="dp-h2" style="margin-top:0">Track by Track</h2><div class="dp-controls" style="margin-top:0"><input type="search" id="rcTrkSearch" placeholder="Search tracks..." aria-label="Search tracks"></div><div class="rc-trk" id="rcTrk" style="padding-bottom:56px">'+D.tracks.map(trackCard).join('')+'</div>';
    }
    $('rcBody').innerHTML=h;
    document.querySelectorAll('[data-dfs]').forEach(function(b){b.addEventListener('click',function(){var p=$(b.dataset.dfs),o=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!o));p.hidden=o})});
    var s=$('rcTrkSearch');if(s)s.addEventListener('input',function(){var q=s.value.trim().toLowerCase();$('rcTrk').innerHTML=D.tracks.filter(function(t){return t.track.toLowerCase().indexOf(q)>=0}).map(trackCard).join('')||'<div class="dp-none">No tracks found</div>'});
  }
  function tabs(){
    $('rcTabs').innerHTML=TABS.map(function(t){return'<button class="rc-tab" role="tab" aria-selected="'+(t===tab)+'" data-t="'+t+'">'+t+'</button>'}).join('');
    document.querySelectorAll('.rc-tab').forEach(function(b){b.addEventListener('click',function(){tab=b.dataset.t;try{history.replaceState(null,'','#'+encodeURIComponent(tab))}catch(e){}tabs();render()})});
  }
  fetch('records_data.json').then(function(r){return r.json()}).then(function(data){
    D=data;var h=decodeURIComponent(location.hash.slice(1));if(TABS.indexOf(h)>=0)tab=h;
    $('rcAsof').textContent='Through Season '+D.asOf.season+', Race '+D.asOf.race+' ('+D.races+' races). Top 3 shown for each record; ties for 3rd are all listed. Streaks count only races a driver entered, so a missed race does not break them.';
    tabs();render();
  }).catch(function(){$('rcBody').innerHTML='<div class="dp-none">Records could not be loaded. Please refresh.</div>'});
})();
</script>
</body>
</html>
